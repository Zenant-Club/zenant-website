<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenant - Coming Soon</title>
    <meta name="description" content="Zenant is currently under development. We are building something extraordinary. Stay tuned for our launch.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
    </div>
    
    <main class="container">
        <div class="glass-card">
            <div class="logo">
                <img src="image.png" alt="Zenant Logo" class="logo-image">
            </div>
            
            <h1 class="title">Something extraordinary is in the works</h1>
            
            <p class="subtitle">
                We are currently crafting a digital experience that redefines boundaries. 
                Our main website is under development and will be live soon.
            </p>
            
            <div class="status-badge">
                <span class="pulse-indicator"></span>
                <span class="status-text">Under Development</span>
            </div>

            <div class="notify-section">
                <p>Want to be the first to know when we launch?</p>
                <form class="notify-form" id="notifyForm">
                    <input type="email" placeholder="Enter your email address" required class="email-input" id="emailInput">
                    <button type="submit" class="notify-btn">Notify Me</button>
                </form>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
